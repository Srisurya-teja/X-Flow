# Stage 3: Mask training (FPN mask prediction + feature masking)
# Loads Stage 2 pretrained backbone, enables mask branch.
# This is the full FROM method with PartialFC.
#
# IMPORTANT: Update these before training:
#   - DATASET.REC_PATH, NUM_CLASS, NUM_IMAGE
#   - NETWORK.PRETRAINED: path to Stage 2 best model

NETWORK:
  PRETRAINED: 'output/Custom/.../backbone_epoch_039.pth.tar'  # <-- CHANGE THIS: pick an epoch from Stage 2's output dir
  IMAGE_SIZE: [112, 112]

DATASET:
  REC_PATH: '/path/to/your/recordio/dataset'
  NUM_CLASS: 100000
  TRAIN_DATASET: 'Custom'

LOSS:
  TYPE: 'CosFace'
  WEIGHT_PRED: 1.0
  SCALE: 64.0
  MARGIN: 0.4
  MARGIN_WARMUP_EPOCHS: 5

TRAIN:
  MODE: 'Mask'
  MODEL: 'iResNet50_FPN'
  LR: 0.001
  LR_STEP: [15, 30]
  LR_FACTOR: 0.1
  END_EPOCH: 40
  BATCH_SIZE: 64
  OPTIMIZER: 'sgd'
  MOMENTUM: 0.9
  WD: 0.0005
  PATTERN: 5
  NUM_MASK: 226
  WORKERS: 8
  PRINT_FREQ: 100

SAMPLE_RATE: 0.1
FP16: True
LR_SCHEDULER: 'cosine'
NUM_IMAGE: 5000000         # <-- CHANGE THIS

# Azure File Share upload
USE_AZURE: True
AZURE_REMOTE_DIR: "training-checkpoint/from"
WARMUP_ITERS: 2000
WARMUP_LR: 0.0
