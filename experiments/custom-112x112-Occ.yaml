# Stage 2: Occlusion training (no mask branch)
# Loads Stage 1 pretrained backbone, adds synthetic occlusion to training data.
#
# IMPORTANT: Update these before training:
#   - DATASET.REC_PATH, NUM_CLASS, NUM_IMAGE
#   - NETWORK.PRETRAINED: path to Stage 1 best model

NETWORK:
  PRETRAINED: 'output/Custom/iResNet50_FPN_CosFace-Clean/custom-112x112-Clean-pattern_5-weight_1.0-lr_0.1-optim_sgd-pretrained_1_factor_1/backbone_epoch_024.pth.tar'
  IMAGE_SIZE: [112, 112]

DATASET:
  REC_PATH: '/training'   
  NUM_CLASS: 390570                       
  TRAIN_DATASET: 'Custom'

LOSS:
  TYPE: 'CosFace'
  WEIGHT_PRED: 1
  SCALE: 64.0
  MARGIN: 0.4
  MARGIN_WARMUP_EPOCHS: 5

TRAIN:
  MODE: 'Occ'
  MODEL: 'iResNet50_FPN'
  LR: 0.1
  BACKBONE_LR: 0.01
  LR_STEP: [15, 30]
  LR_FACTOR: 0.1
  END_EPOCH: 40
  BATCH_SIZE: 512
  OPTIMIZER: 'sgd'
  MOMENTUM: 0.9
  WD: 0.0005
  PATTERN: 5
  NUM_MASK: 226
  WORKERS: 8
  PRINT_FREQ: 100

SAMPLE_RATE: 0.4
FP16: True
LR_SCHEDULER: 'cosine'
NUM_IMAGE: 25342967        # <-- CHANGE THIS

# Azure File Share upload
USE_AZURE: True
AZURE_REMOTE_DIR: "training-checkpoint/x-flow/phase-2"
WARMUP_ITERS: 2000
WARMUP_LR: 0.0
CHECKPOINT_UPLOAD_FREQ: 5
