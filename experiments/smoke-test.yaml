# Smoke test — validate the iResNet50 + FPN backbone, cosine LR, and margin ramp
# in a few seconds before committing to a full run. Run with --max_steps:
#
#   torchrun --nproc_per_node=3 train_distributed.py --cfg experiments/smoke-test.yaml \
#       --pattern 5 --ratio 3 --batch_size 16 --workers 4 --max_steps 20
#
# It runs 2 short epochs (20 steps each) so you also exercise per-rank checkpoint
# saving and the metrics CSV. Azure upload is OFF here.

NETWORK:
  PRETRAINED: ''
  IMAGE_SIZE: [112, 112]

DATASET:
  REC_PATH: '/training'      # <-- your RecordIO dir
  NUM_CLASS: 390570          # <-- must match your dataset
  TRAIN_DATASET: 'SmokeTest'

LOSS:
  TYPE: 'CosFace'
  WEIGHT_PRED: 1.0
  SCALE: 64.0
  MARGIN: 0.4
  MARGIN_WARMUP_EPOCHS: 1

TRAIN:
  MODE: 'Clean'
  MODEL: 'iResNet50_FPN'
  LR: 0.3
  END_EPOCH: 2
  BATCH_SIZE: 16
  OPTIMIZER: 'sgd'
  MOMENTUM: 0.9
  WD: 0.0005
  PATTERN: 5
  NUM_MASK: 226
  WORKERS: 4
  PRINT_FREQ: 5

SAMPLE_RATE: 1
FP16: True
LR_SCHEDULER: 'cosine'
NUM_IMAGE: 25342967

USE_AZURE: False
WARMUP_ITERS: 20
WARMUP_LR: 0.0
